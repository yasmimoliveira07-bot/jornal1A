<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Curiosidades sobre Gatos</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(180deg,#6f6f6f,#8d8d8d,#b5b5b5,#d7d7d7);
            min-height:100vh;
        }

        h1{
            text-align:center;
            color:white;
            font-size:62px;
            letter-spacing:2px;
            padding-top:35px;
            text-shadow:4px 4px 12px rgba(0,0,0,.45);
            animation:aparecer 1s ease;
        }

        .descricao{
            text-align:center;
            color:#f5f5f5;
            font-size:23px;
            max-width:900px;
            margin:15px auto 45px;
            padding:0 20px;
            text-shadow:2px 2px 6px rgba(0,0,0,.35);
        }

        .galeria{
            max-width:1900px;
            margin:auto;
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:35px;
            padding:30px;
        }

        .card{
            position:relative;
            background:#fafafa;
            border-radius:24px;
            overflow:hidden;
            border:2px solid rgba(255,255,255,.35);
            box-shadow:0 20px 40px rgba(0,0,0,.28);
            transition:.45s;
            animation:subir .8s ease;
        }

        .card:hover{
            transform:translateY(-15px) scale(1.03);
            box-shadow:0 35px 60px rgba(0,0,0,.38);
        }

        /* Brilho passando pelo card */

        .card::after{
            content:"";
            position:absolute;
            top:0;
            left:-120%;
            width:70%;
            height:100%;
            background:linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,.55),
                transparent
            );
            transform:skewX(-20deg);
            transition:.8s;
        }

        .card:hover::after{
            left:150%;
        }

        .card img{
            width:700px;
            max-width:100%;
            display:block;
            transition:.45s;
        }

        .card img:hover{
            transform:scale(1.05);
        }

        .nome{
            text-align:center;
            font-size:28px;
            color:#555;
            padding:18px;
            letter-spacing:2px;
        }

        footer{
            margin-top:60px;
            padding:30px;
            text-align:center;
            color:white;
            font-size:18px;
            border-top:1px solid rgba(255,255,255,.25);
            text-shadow:2px 2px 5px rgba(0,0,0,.4);
        }

        @keyframes aparecer{

            from{
                opacity:0;
                transform:translateY(-30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        @keyframes subir{

            from{
                opacity:0;
                transform:translateY(60px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        @media(max-width:900px){

            h1{
                font-size:42px;
            }

            .descricao{
                font-size:18px;
            }

            .card img{
                width:100%;
            }

            .galeria{
                padding:15px;
            }

        }

    </style>

</head>

<body>
