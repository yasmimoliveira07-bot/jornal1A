<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATOS</title>

    <style>
        body {
            background-color: #bdbdbd;
            margin: 0;
            font-family: Arial;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 60px;
            padding: 20px;
            text-shadow: 2px 2px 5px black;
        }

        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 15px;
        }

        .galeria img {
            width: 430px; /* AUMENTEI AQUI */
            border-radius: 12px;
            transition: 0.3s;
        }

        .galeria img:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>GATOS</h1>

    <div class="galeria">
        <img src="foto1.jpg">
        <img src="2.jpg">
        <img src="3.jpg">
        <img src="4.jpg">
        <img src="6.jpg">
        <img src="7.jpg">
    </div>

</body>

</html>
