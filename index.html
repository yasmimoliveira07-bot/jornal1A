<head>

    <title>Curiosidades sobre Gatos</title>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            background:linear-gradient(
                to bottom,
                #595959,
                #747474,
                #969696,
                #bfbfbf
            );
        }

        h1{
            text-align:center;
            color:white;
            font-size:60px;
            font-weight:700;
            letter-spacing:2px;
            margin-top:40px;
            text-shadow:0 5px 15px rgba(0,0,0,.45);
            animation:titulo 1s ease;
        }

        .descricao{
            text-align:center;
            color:#f3f3f3;
            font-size:20px;
            max-width:700px;
            margin:20px auto 50px;
            line-height:1.7;
            text-shadow:2px 2px 5px rgba(0,0,0,.35);
            padding:0 20px;
        }

        .galeria{
            max-width:1900px;
            margin:auto;
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:45px;
            padding:25px;
        }

        .card{
            position:relative;
            background:#fafafa;
            border-radius:30px;
            overflow:hidden;
            border:2px solid rgba(255,255,255,.25);
            box-shadow:0 20px 45px rgba(0,0,0,.28);
            transition:.45s;
            animation:subir .8s ease both;
        }

        .card:hover{
            transform:translateY(-12px);
            box-shadow:0 35px 65px rgba(0,0,0,.4);
        }

        .card::after{

            content:"";

            position:absolute;

            top:0;
            left:-120%;

            width:60%;
            height:100%;

            background:linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,.45),
                transparent
            );

            transform:skewX(-20deg);

            transition:.8s;

        }

        .card:hover::after{

            left:150%;

        }

        .card img{

            width:700px;
            max-width:100%;
            display:block;
            transition:.4s;

        }

        .card img:hover{

            transform:scale(1.04);

        }

        .nome{

            text-align:center;
            font-size:26px;
            color:#666;
            padding:18px;
            letter-spacing:3px;

        }

        footer{

            margin-top:70px;
            text-align:center;
            color:white;
            padding:35px;
            font-size:17px;
            border-top:1px solid rgba(255,255,255,.2);

        }

        @keyframes titulo{

            from{

                opacity:0;
                transform:translateY(-35px);

            }

            to{

                opacity:1;
                transform:translateY(0);

            }

        }

        @keyframes subir{

            from{

                opacity:0;
                transform:translateY(60px);

            }

            to{

                opacity:1;
                transform:translateY(0);

            }

        }

        @media(max-width:900px){

            h1{

                font-size:42px;
                padding:0 15px;

            }

            .descricao{

                font-size:17px;

            }

            .card img{

                width:100%;

            }

            .galeria{

                gap:25px;
                padding:15px;

            }

        }

    </style>

</head>
