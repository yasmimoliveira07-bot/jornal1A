<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Gatos 🐱</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(180deg,#dcdcdc,#9f9f9f);
            min-height:100vh;
        }

        h1{
            text-align:center;
            color:white;
            font-size:60px;
            padding:30px;
            text-shadow:3px 3px 8px rgba(0,0,0,.5);
            animation: aparecer 1s ease;
        }

        .galeria{
            max-width:1800px;
            margin:auto;
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:30px;
            padding:30px;
        }

        .card{
            background:white;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,.25);
            transition:.35s;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 18px 35px rgba(0,0,0,.4);
        }

        .card img{
            width:550px;
            max-width:100%;
            display:block;
            transition:.35s;
        }

        .card img:hover{
            transform:scale(1.08);
        }

        .nome{
            text-align:center;
            font-size:22px;
            font-weight:bold;
            padding:15px;
            color:#444;
        }

        @keyframes aparecer{
            from{
                opacity:0;
                transform:translateY(-30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:700px){

            h1{
                font-size:42px;
            }

            .card img{
                width:100%;
            }

            .galeria{
                padding:15px;
            }

        }
    </style>
</head>

<body>

    <h1>🐱 Galeria de Gatos 🐱</h1>

    <div class="galeria">

        <div class="card">
            <img src="foto1.jpg" alt="Gato 1">
            <div class="nome">🐾 Gato 1</div>
        </div>

        <div class="card">
            <img src="2.jpg" alt="Gato 2">
            <div class="nome">🐾 Gato 2</div>
        </div>

        <div class="card">
            <img src="3.jpg" alt="Gato 3">
            <div class="nome">🐾 Gato 3</div>
        </div>

        <div class="card">
            <img src="4.jpg" alt="Gato 4">
            <div class="nome">🐾 Gato 4</div>
        </div>

        <div class="card">
            <img src="6.jpg" alt="Gato 5">
            <div class="nome">🐾 Gato 5</div>
        </div>

        <div class="card">
            <img src="7.jpg" alt="Gato 6">
            <div class="nome">🐾 Gato 6</div>
        </div>

    </div>

</body>

</html>
